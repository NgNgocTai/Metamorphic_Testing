apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: lab-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: lab-a
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-binding
  namespace: lab-a
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: system:serviceaccount:lab-a:app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: app
      containers:
      - name: web
        image: nginx:1.27
        securityContext:
          privileged: false
