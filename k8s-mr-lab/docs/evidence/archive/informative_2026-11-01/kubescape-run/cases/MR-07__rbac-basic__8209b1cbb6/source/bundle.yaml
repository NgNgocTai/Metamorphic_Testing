apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: lab-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: lab-a
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-binding
  namespace: lab-a
subjects:
- kind: ServiceAccount
  name: app
  namespace: lab-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-role
