metadata:
  name: demo
  namespace: lab-a
spec:
  containers:
  - name: app
    image: nginx:1.27
    securityContext:
      privileged: false
  - name: sidecar
    image: busybox:1.36
    command:
    - sleep
    - '3600'
    securityContext:
      privileged: false
