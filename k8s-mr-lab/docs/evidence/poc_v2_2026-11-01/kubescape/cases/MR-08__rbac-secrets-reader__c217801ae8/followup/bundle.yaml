apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: lab-c
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader-role
  namespace: lab-c
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-binding
  namespace: lab-c
subjects:
- kind: ServiceAccount
  name: reader
  namespace: lab-c-shifted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reader-role
---
apiVersion: v1
kind: Pod
metadata:
  name: reader-pod
  namespace: lab-c
spec:
  serviceAccountName: reader
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sleep
    - '3600'
    securityContext:
      privileged: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: lab-c-shifted
