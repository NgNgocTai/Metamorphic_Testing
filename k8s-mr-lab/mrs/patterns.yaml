# MR pattern catalog. A pattern is a *recurring structure* observed in shipped MRs (the MST-wi way: patterns are
# classified from existing MRs, not designed first). `shared_code` says what, if anything, the code actually shares.
# Which MRs use a pattern is NOT listed here: it is derived from `pattern:` in catalog.yaml (single source).
# Allowed relations are enforced by `k8s-mr-lab mr validate`.
#
# template_elements: the MR template vocabulary (the K8s analogue of MST-wi Table 3). Each MR declares, under
# `template:` in catalog.yaml, only the elements that cannot be derived from other metadata. Derived elements:
#   P-VERDICT  from relation (pass_to_fail / fail_to_pass: the checker requires the source verdict)
#   S-ALL      from all_failures: true (else S-TARGET)
#   O-*        from relation
# `k8s-mr-lab mr patterns` builds the MR x element matrix and groups identical rows (the MST-wi Table 4 method), so the
# hand-named KP families below can be compared with the element-level grouping.
template_elements:
  preconditions:
    P-STRUCT: the target object must have a given shape (field present with a value, rule with >= 2 verbs, ...)
    P-REF: a reference path must exist in the bundle (RoleBinding -> Role in its namespace, subject ServiceAccount present)
    P-CLOSED: no other path in the closed bundle may grant the same property (checked before the subject-level scope is used)
    P-VERDICT: the source verdict of the compared control must be conclusive in the expected direction (derived)
  followup:
    G-REWRITE: rewrite existing objects without changing their API meaning
    G-ADD: add object(s); existing objects stay byte-identical
    G-MODIFY: change one field value with a known security effect
    G-REMOVE: remove object(s) or field(s)
  scope:
    S-TARGET: only (control, resource) keys derived from the MR's targets (derived)
    S-ALL: every mapped control on every object of its kind plus every FAIL in either report (derived)
  output:
    O-EQUAL: verdicts identical (derived from relation equal)
    O-PASS-TO-FAIL: PASS on source, FAIL on follow-up (derived)
    O-FAIL-TO-PASS: FAIL on source, PASS on follow-up (derived)
patterns:
  - id: KP1
    name: representation-invariance
    intent: rewrite the configuration without changing its Kubernetes semantics; every in-scope verdict must stay equal
    allowed_relations: [equal]
    pair_validation: an invariant of the bundle (canonical content, expanded permission tuples) is identical before and after, and the text really changed
    base_class: MetamorphicRelation
    shared_code: none beyond validation.diff_bundles; the invariants differ (MR-01 parsed content, MR-03 permission tuples) so no base class is justified yet
    proof_obligation: the rewrite preserves the object's API meaning (YAML mapping order; RBAC additivity)
  - id: KP2
    name: unrelated-resource-noninterference
    intent: add an object that nothing in scope references; in-scope verdicts must stay equal
    allowed_relations: [equal]
    pair_validation: the diff is exactly one added object, and no binding/selector can reach it from the target
    base_class: MetamorphicRelation
    shared_code: none (single instance, MR-02); do not abstract until a second instance exists
    proof_obligation: the platform resolves references by (kind, namespace, name); an object in another namespace is unreachable
  - id: KP3
    name: controlled-single-field-change
    intent: change one security-relevant field in one known direction; the mapped control must move accordingly
    allowed_relations: [pass_to_fail, fail_to_pass]
    pair_validation: the diff is exactly one in-place change old -> new at one declared path of one declared object
    base_class: ControlledChange
    shared_code: transforms.patterns.ControlledChange + validation.expect_single_change
    proof_obligation: the field alone decides the property (no other path in the bundle grants it) and the control claims to detect it
  - id: KP4
    name: property-preserving-substitution
    intent: replace one value by another that the cited requirement says is equivalent FOR THE PROPERTY (not for the API); in-scope verdicts must stay equal
    allowed_relations: [equal]
    pair_validation: the change is confined to the substituted field of the one target object, and the new value is inside the equivalence set the requirement names
    base_class: MetamorphicRelation
    shared_code: none (single instance, MR-09); hypothesis until a second MR (e.g. hostPID/hostIPC substitution does not qualify) shows the same structure
    proof_obligation: the requirement text states the equivalence for the property, and every mapped control's contract is about that property rather than about the field value
