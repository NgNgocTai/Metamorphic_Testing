# MR catalog. Each entry is (Precondition, Transformation, ExpectedRelation, Scope) + limits + a counterexample that
# the structural validator / applicability check must reject (enforced by tests/unit/test_mrs.py).
mrs:
  - id: MR-01
    name: yaml-key-order
    category: Syntax
    status: mvp
    pattern: KP1
    property_id: SP-SYN-MAPPING-ORDER
    origin: sanity          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: []
    touches: ["*"]
    targets: [ALL_OF_KIND]
    template: {preconditions: [], followup: [G-REWRITE]}
    all_failures: true   # also compare every FAIL seen in either report
    property: scanner verdicts do not depend on mapping-key order
    relation: equal
    scope: every mapped control on every object of its kind, plus every FAIL seen in either report
    preconditions:
      - bundle has no duplicate mapping keys
      - reordering changes the text
    transformation: reverse or sort mapping keys recursively; sequence order is preserved
    pair_checks:
      - parsed content identical (canonical JSON)
      - document order identical
      - text differs
    counterexample: reordering a *sequence* (e.g. containers) is NOT allowed because it changes semantics; the validator rejects a follow-up whose parsed content differs
    limits:
      - a scanner that is wrong in the same way on both inputs passes
      - line numbers are not compared

  - id: MR-02
    name: add-unbound-same-name-role
    category: R4
    status: mvp
    pattern: KP2
    property_id: SP-RBAC-NS-ROLE-RESOLUTION
    origin: empirical          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: [{id: R06, coverage: full}]
    touches: [Role]
    targets: [bound_role, subject_sa, workload, rolebinding]
    template: {preconditions: [P-REF], followup: [G-ADD]}
    property: effective permissions of the ServiceAccount bound by a namespaced RoleBinding
    relation: equal
    scope: "Kubescape only. The workloads that run as the target ServiceAccount (C-0267, C-0272) and, for the aggregating RBAC controls, the target ServiceAccount and its RoleBinding; NEVER the added decoy Role. The bound Role is unchanged and is not compared. Trivy: no mapped check can observe the change (unsupported)"
    preconditions:
      - RoleBinding points at a Role in its own namespace
      - a ServiceAccount subject that exists in the bundle
    transformation: add a Role with the same name in a fresh namespace (profile secrets_read or wildcard_admin); add no binding
    pair_checks:
      - diff is exactly one added Role
      - decoy namespace holds only that Role
      - binding count unchanged
    counterexample: a control that audits every Role (e.g. Trivy KSV-0113 on the decoy itself) legitimately reports the decoy; such findings are out of scope and are never compared
    limits:
      - covers name-only join bugs; a RoleBinding to a ClusterRole is not covered

  - id: MR-03
    name: split-rule-verbs
    category: R3
    status: mvp
    pattern: KP1
    property_id: SP-RBAC-ADDITIVE-RULES
    origin: semantic          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: []
    touches: [Role, ClusterRole]
    targets: [bound_role, subject_sa, workload]
    template: {preconditions: [P-STRUCT], followup: [G-REWRITE]}
    property: effective permissions of a Role
    relation: equal
    scope: effective-permission controls of the Role and of workloads bound to it
    preconditions:
      - a rule with at least two distinct verbs
    transformation: replace one rule by one rule per verb (all other fields copied)
    pair_checks:
      - expanded permission tuples identical
      - rule count increased
      - change confined to rules of the target Role
    counterexample: a control that counts rules or inspects rule shape would legitimately change; none is mapped for this MR
    limits:
      - wildcard verbs are not expanded, so splitting a wildcard is rejected by the tuple check

  - id: MR-04
    name: privileged-flip
    category: R9
    status: mvp_conditional
    pattern: KP3
    property_id: SP-POD-PRIVILEGED
    origin: retrospective          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: [{id: R01, coverage: full}]
    touches: [workload]
    targets: [workload]
    template: {preconditions: [P-STRUCT], followup: [G-MODIFY]}
    property: container runs privileged
    relation: pass_to_fail
    scope: the privileged-container control of each scanner on the mutated workload
    preconditions:
      - container has explicit securityContext.privileged false
      - source verdict of the control is PASS (evidenced)
    transformation: set securityContext.privileged to true on exactly one container
    pair_checks:
      - exactly one change, privileged false to true, on the target workload
    counterexample: if the source verdict is not PASS or not evidenced the comparison is INCONCLUSIVE, never a violation
    limits:
      - does not claim that the total number of findings must grow

  - id: MR-05
    name: api-group-switch
    category: R3
    status: mvp_conditional
    pattern: KP3
    property_id: SP-RBAC-SECRETS-API-GROUP
    origin: empirical          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: []
    touches: [Role]
    targets: [role_direct, bound_role, subject_sa, workload]
    template: {preconditions: [P-STRUCT, P-CLOSED], followup: [G-MODIFY]}
    property: read access to core-group Secrets
    relation: fail_to_pass
    scope: controls that claim to detect core Secrets read access, on the Role and its bound workload
    preconditions:
      - Role has exactly one rule, apiGroups core, resources secrets, read-only verbs, no resourceNames
      - source verdict of the control is FAIL (evidenced)
    transformation: change apiGroups from core to apps
    pair_checks:
      - exactly one change, rules[0].apiGroups[0] from empty string to apps
    counterexample: with a second rule granting secrets (or a wildcard) the permission survives the change, so the Role is not eligible
    limits:
      - valid only for controls whose documentation covers core Secrets; unrelated controls are not mapped
      - "closed-bundle premise: only bindings present in the bundle are examined for other paths to the same permission (local-file mode); not valid for a live cluster unless the bundle is known to be complete for the subject"

  - id: MR-06
    name: host-network-flip
    category: R9
    status: candidate        # mapped and run on one DEV seed only; promoting it would add MR-06 rows to every default run, so it stays opt-in (--mr MR-06)
    pattern: KP3
    property_id: SP-POD-HOST-NAMESPACES
    origin: retrospective          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: [{id: R02, coverage: partial}]
    touches: [workload]
    targets: [workload]
    template: {preconditions: [P-STRUCT], followup: [G-MODIFY]}
    property: pod shares the node network namespace (spec.hostNetwork)
    relation: pass_to_fail
    scope: Trivy KSV-0009 and Kubescape C-0041 on the mutated workload
    preconditions:
      - workload pod spec has explicit hostNetwork false
      - source verdict of the mapped control is PASS (evidenced)
    transformation: set spec.hostNetwork to true on exactly one workload
    pair_checks:
      - exactly one change, hostNetwork false to true, on the target workload
    counterexample: a pod spec without an explicit hostNetwork is not a candidate; a follow-up that also changes hostPID is INVALID_PAIR
    limits:
      - hostPID and hostIPC are separate properties and are not mutated
      - Trivy's PASS on the source is inferred (no FAIL attributed), Kubescape's is explicit
      - "evidence so far: one DEV seed (seeds/candidate/pod-hostnet), n=1 per scanner; no held-out evaluation"

  - id: MR-07
    name: sa-subject-as-user
    category: R1
    status: candidate        # designed after reading C-0267/C-0272 rego (subject.kind == "ServiceAccount"): guided, not blind
    pattern: KP1
    property_id: SP-RBAC-SA-SUBJECT-IDENTITY
    origin: empirical          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: []
    touches: [RoleBinding]
    targets: [bound_role, subject_sa, workload, rolebinding]
    template: {preconditions: [P-STRUCT, P-REF], followup: [G-REWRITE]}
    property: effective permissions of the ServiceAccount named by a RoleBinding subject
    relation: equal
    scope: Role-level controls on the bound Role and workload-level controls on the workloads that run as the ServiceAccount
    preconditions:
      - RoleBinding points at a Role in its own namespace
      - the subject is a ServiceAccount with an explicit namespace, and that ServiceAccount exists in the bundle
    transformation: replace that one subject by {kind User, apiGroup rbac.authorization.k8s.io, name system:serviceaccount:<ns>:<name>}
    pair_checks:
      - the subject became exactly the equivalent User subject
      - the RoleBinding is otherwise unchanged and no other object changed
    counterexample: a Group subject (system:serviceaccounts:<ns>) is NOT equivalent (it covers every ServiceAccount of the namespace), and a User name with another namespace names a different identity; both must be rejected
    limits:
      - "relies on the documented username of service accounts; it does not cover tokens issued for other identities"
      - "the subject namespace must be explicit: defaulting of a missing namespace is not modelled"
      - "evidence so far: DEV seeds only (synthetic + historical), no held-out evaluation"

  - id: MR-08
    name: sa-subject-namespace-shift
    category: R1
    status: candidate        # designed from the mutation gap analysis (docs/MUTATION_GAP_ANALYSIS.md); no independent evidence yet
    pattern: KP3
    property_id: SP-RBAC-SA-SUBJECT-NAMESPACE
    origin: empirical          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: []
    touches: [RoleBinding, ServiceAccount]
    targets: [workload]
    template: {preconditions: [P-STRUCT, P-REF, P-CLOSED], followup: [G-MODIFY, G-ADD]}
    property: a ServiceAccount subject names (namespace, name); a binding for S1:N grants nothing to S2:N
    relation: fail_to_pass
    scope: workload-level controls only (Kubescape C-0267, C-0272) on the workload that runs as the ServiceAccount; Role-level controls are NOT compared because the Role is still granted to the moved subject
    preconditions:
      - RoleBinding points at a Role in its own namespace and has exactly one subject, a ServiceAccount with an explicit namespace that exists in the bundle
      - a workload runs as that ServiceAccount
      - no other binding grants anything to that ServiceAccount (ServiceAccount subject, the equivalent User, or the groups system:serviceaccounts, system:serviceaccounts:<ns>, system:authenticated)
      - the source verdict of the compared control is FAIL (evidenced)
    transformation: change that subject's namespace to a fresh namespace and add ServiceAccount <fresh>/<name>
    pair_checks:
      - exactly one changed field (the subject namespace) and exactly one added object (the ServiceAccount in the fresh namespace)
      - the workloads that use the original ServiceAccount are unchanged
    counterexample: another binding, a Group subject or the equivalent User subject still grants the role to the original ServiceAccount, so the permission survives and the relation would be wrong; precondition rejects each
    limits:
      - "relies on an inference from the documented identity of a service account (namespace is part of it); no verbatim sentence states that a binding for S1:N grants nothing to S2:N"
      - "closed-bundle premise; a live cluster may add other paths"
      - "Trivy has no workload-level RBAC control, so the MR is not mapped for Trivy"
      - "evidence: development seeds only"

  - id: MR-09
    name: secrets-read-verb-substitution
    category: R3
    status: candidate        # derived from requirement R08 before any run; DEV evidence only
    pattern: KP4
    property_id: SP-RBAC-SECRETS-READ-VERBS
    origin: prospective          # prospective | retrospective | empirical | semantic | sanity (docs/architecture/UNIFIED_FRAMEWORK.md)
    requirements: [{id: R08, coverage: full}]
    touches: [Role]
    targets: [role_direct, bound_role]
    template: {preconditions: [P-STRUCT], followup: [G-MODIFY]}
    property: a Secrets rule exposes the same contents whichever non-empty subset of get, list, watch it names
    relation: equal
    scope: Trivy KSV-0113 and Kubescape C-0015 on the modified Role only
    preconditions:
      - the Role has exactly one rule that reaches Secrets, with apiGroups [""], resources ["secrets"] and no resourceNames
      - its verbs are a non-empty subset of get, list, watch
    transformation: replace that rule's verbs by one other read verb
    pair_checks:
      - exactly the verbs of the target rule changed, to one read verb; nothing else differs
    counterexample: a rule with resourceNames, several resources, a non-core apiGroup, or a verb outside get/list/watch (create, delete, "*") is not eligible; list/watch with resourceNames behave differently from get
    limits:
      - "equivalence is of Secret exposure, not of API semantics; a control that distinguishes verbs is out of scope"
      - "both mapped controls read get, list and watch in their rego (KSV-0113 readVerbs, C-0015 verbs); C-0015's description only says list/get"
      - "evidence: development seeds only"
