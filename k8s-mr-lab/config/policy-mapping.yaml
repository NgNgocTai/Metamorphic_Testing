# MR -> scanner control applicability and comparison scope. The ONLY hand-written control/scope file.
#   * What a control reads and reports on: config/control-registry.yaml (generated from the pinned policy; never repeated here).
#   * What an MR changes and which target selectors its implementation can produce: mrs/catalog.yaml (`touches`, `targets`).
#   * This file says, for each MR and scanner, WHICH controls are compared and on WHICH target selector, and WHY.
#
# Entry: {control, target, reason, role}
#   target  a selector declared in `targets` below AND listed in the MR's catalog `targets` (or ALL_OF_KIND, allowed only for an MR whose
#           catalog `touches` is ["*"], i.e. a rewrite of every object).
#   role    property (default): the comparison must be able to observe what the MR changes; `mr validate` enforces it from `touches` and the
#           control registry. control: a deliberate negative control that must NOT react; allowed to be unobservable, must say so in `reason`.
# `unsupported` lists every (MR, scanner) with no entry, with the reason; `mr validate` rejects a silent gap.
# Not an expected-verdict table: the expected relation lives in the MR (catalog `relation`).
schema: mr-mapping/1

targets:
  bound_role:  {kinds: [Role, ClusterRole], meaning: the Role/ClusterRole referenced by the target RoleBinding}
  role_direct: {kinds: [Role], meaning: the modified Role itself}
  subject_sa:  {kinds: [ServiceAccount], meaning: the ServiceAccount whose effective permissions are the subject of the property}
  rolebinding: {kinds: [RoleBinding], meaning: the target RoleBinding}
  workload:    {kinds: [Pod, Deployment, ReplicaSet, StatefulSet, DaemonSet, CronJob, Job], meaning: workloads that run as the target ServiceAccount, or the mutated workload}

mrs:
  MR-01:
    trivy:
      - {control: KSV-0017, target: ALL_OF_KIND, reason: "representation rewrite touches every object, so any mapped check can observe it"}
      - {control: KSV-0113, target: ALL_OF_KIND, reason: "same"}
      - {control: KSV-0048, target: ALL_OF_KIND, reason: "same"}
      - {control: KSV-0049, target: ALL_OF_KIND, reason: "same"}
      - {control: KSV-0112, target: ALL_OF_KIND, reason: "same"}
      - {control: KSV-0050, target: ALL_OF_KIND, reason: "same"}
    kubescape:
      - {control: C-0057, target: ALL_OF_KIND, reason: "representation rewrite touches every object, so any mapped control can observe it"}
      - {control: C-0267, target: ALL_OF_KIND, reason: "same"}
      - {control: C-0272, target: ALL_OF_KIND, reason: "same"}
      - {control: C-0015, target: ALL_OF_KIND, reason: "same"}
      - {control: C-0007, target: ALL_OF_KIND, reason: "same"}
      - {control: C-0035, target: ALL_OF_KIND, reason: "same"}
      - {control: C-0053, target: ALL_OF_KIND, reason: "same"}
  MR-02:
    kubescape:
      - {control: C-0267, target: workload, reason: "joins RoleBinding to Role in its own rego and reports on the workload that runs as the bound ServiceAccount"}
      - {control: C-0272, target: workload, reason: "same join as C-0267, administrative roles"}
      - {control: C-0015, target: subject_sa, reason: "aggregator control: the verdict attaches to the ServiceAccount of the subject-role-binding triple, whose effective permissions are the property"}
      - {control: C-0015, target: rolebinding, reason: "aggregator control: the verdict also attaches to the RoleBinding of the triple"}
      - {control: C-0007, target: subject_sa, reason: "aggregator control, delete capability"}
      - {control: C-0007, target: rolebinding, reason: "aggregator control, delete capability"}
      - {control: C-0035, target: subject_sa, reason: "aggregator control, administrative roles"}
      - {control: C-0035, target: rolebinding, reason: "aggregator control, administrative roles"}
      - {control: C-0053, target: subject_sa, reason: "aggregator control, container service account access"}
      - {control: C-0053, target: rolebinding, reason: "aggregator control, container service account access"}
      - {control: C-0057, target: workload, role: control, reason: "reads workloads only, so it cannot observe an added Role: kept as a negative control that must not react"}
  MR-03:
    trivy:
      - {control: KSV-0113, target: bound_role, reason: "judges the Role whose rules were split; permission-based, not rule-count-based"}
      - {control: KSV-0048, target: bound_role, reason: "same, workload-creating permissions"}
      - {control: KSV-0049, target: bound_role, reason: "same, configmaps"}
      - {control: KSV-0112, target: bound_role, reason: "same, all resources"}
      - {control: KSV-0050, target: bound_role, reason: "same, RBAC resources"}
    kubescape:
      - {control: C-0015, target: bound_role, reason: "aggregator control that reads the Role whose rules were split"}
      - {control: C-0007, target: bound_role, reason: "same"}
      - {control: C-0035, target: bound_role, reason: "same"}
      - {control: C-0267, target: workload, reason: "reads the Role in its rego and reports on the workload"}
      - {control: C-0272, target: workload, reason: "same"}
  MR-04:
    trivy:
      - {control: KSV-0017, target: workload, reason: "judges the mutated workload's privileged field"}
    kubescape:
      - {control: C-0057, target: workload, reason: "judges the mutated workload's privileged field"}
  MR-05:
    trivy:
      - {control: KSV-0113, target: role_direct, reason: "judges the modified Role; a Role-level check never needs a binding"}
    kubescape:
      - {control: C-0015, target: bound_role, reason: "aggregator control reading the modified Role"}
      - {control: C-0267, target: workload, reason: "reads the Role in its rego and reports on the workload; dropped by the MR when another path may still grant Secrets"}
  MR-06:
    trivy:
      - {control: KSV-0009, target: workload, reason: "judges spec.hostNetwork of the mutated workload"}
    kubescape:
      - {control: C-0041, target: workload, reason: "judges spec.hostNetwork of the mutated workload"}
  MR-07:
    kubescape:
      - {control: C-0267, target: workload, reason: "joins on subjects[].kind == ServiceAccount, the field MR-07 rewrites"}
      - {control: C-0272, target: workload, reason: "same join as C-0267"}
      - {control: C-0015, target: bound_role, reason: "aggregator control reading the RoleBinding and its Role"}
      - {control: C-0007, target: bound_role, reason: "same"}
      - {control: C-0035, target: bound_role, reason: "same"}
  MR-08:
    kubescape:
      - {control: C-0267, target: workload, reason: "workload-level: the workload must lose the permission; Role-level controls keep their verdict because the Role is still granted"}
      - {control: C-0272, target: workload, reason: "same"}
  MR-09:
    trivy:
      - {control: KSV-0113, target: role_direct, reason: "readVerbs in its rego covers get, list and watch; judges the modified Role"}
    kubescape:
      - {control: C-0015, target: bound_role, reason: "verbs in its rego cover get, list, watch; aggregator control reading the modified Role"}

unsupported:
  MR-02:
    trivy: "every mapped Trivy check judges one Role document and MR-02 only adds an unrelated Role, so no Trivy check can observe the change"
  MR-07:
    trivy: "mapped Trivy checks judge one Role document; MR-07 only rewrites a RoleBinding subject, and no Trivy check reads a ServiceAccount subject"
  MR-08:
    trivy: "Trivy has no workload-level RBAC check, and Role-level checks must keep their verdict"
